<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aquarius Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#111111;
    --deep:#000000;
    --aqua:#9a9a9a;
    --aqua-light:#f0f0f0;
    --sand:#fafafa;
    --gold:#111111;
    --white:#ffffff;
    --line:rgba(0,0,0,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Manrope',sans-serif;
    background:var(--sand);
    color:var(--ink);
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
  }

  /* HEADER */
  header{
    padding:28px 20px 22px;
    background:var(--deep);
    color:var(--white);
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:'';
    position:absolute;
    right:-40px; top:-60px;
    width:180px; height:180px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(127,169,168,0.35), transparent 70%);
  }
  .brand{
    font-size:28px;
    font-weight:600;
    letter-spacing:0.5px;
    margin:0;
    position:relative;
  }
  .brand span{ color:var(--aqua); font-style:italic; }
  .tagline{
    margin:4px 0 0;
    font-size:13px;
    color:rgba(255,255,255,0.65);
    letter-spacing:1.5px;
    text-transform:uppercase;
    position:relative;
  }

  /* CATEGORY TABS */
  .tabs{
    display:flex;
    gap:8px;
    padding:16px 16px 8px;
    overflow-x:auto;
    background:var(--sand);
    position:sticky;
    top:0;
    z-index:5;
    border-bottom:1px solid var(--line);
  }
  .tab{
    flex:none;
    padding:9px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--white);
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    white-space:nowrap;
    transition:all .2s;
  }
  .tab.active{
    background:var(--deep);
    color:var(--white);
    border-color:var(--deep);
  }
  .subtabs{
    display:flex;
    gap:8px;
    padding:0 16px 12px;
    overflow-x:auto;
    background:var(--sand);
  }
  .subtab{
    flex:none;
    padding:6px 13px;
    border-radius:999px;
    border:1px solid var(--line);
    background:transparent;
    font-size:12px;
    font-weight:600;
    color:#555;
    cursor:pointer;
    white-space:nowrap;
  }
  .subtab.active{
    border-color:var(--ink);
    color:var(--ink);
    background:var(--white);
  }

  /* GRID */
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    padding:16px;
  }
  .card{
    background:var(--white);
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--line);
    display:flex;
    flex-direction:column;
  }
  .card-img{
    width:100%;
    aspect-ratio:1/1;
    background:var(--aqua-light);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    color:var(--aqua);
    text-align:center;
    padding:8px;
  }
  .card-body{
    padding:10px 12px 12px;
    display:flex;
    flex-direction:column;
    gap:4px;
    flex:1;
  }
  .card-name{
    font-size:13.5px;
    font-weight:600;
    line-height:1.3;
  }
  .card-price{
    font-family:'Fraunces',serif;
    font-size:17px;
    font-weight:600;
    color:var(--deep);
  }
  .stock{
    font-size:11px;
    font-weight:600;
    padding:3px 8px;
    border-radius:6px;
    width:fit-content;
  }
  .stock.in{ background:var(--white); color:var(--ink); border:1px solid var(--ink); }
  .stock.low{ background:var(--ink); color:var(--white); }
  .stock.out{ background:var(--white); color:#999; border:1px solid #ccc; text-decoration:line-through; }
  .add-btn{
    margin-top:auto;
    background:var(--deep);
    color:var(--white);
    border:none;
    border-radius:8px;
    padding:9px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .add-btn:disabled{
    background:#cfcac0;
    cursor:not-allowed;
  }

  /* CART BAR */
  .cart-bar{
    position:fixed;
    bottom:16px;
    left:16px;
    right:16px;
    background:var(--deep);
    color:var(--white);
    border-radius:14px;
    padding:14px 16px;
    display:none;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 10px 30px rgba(13,34,38,0.35);
    z-index:20;
  }
  .cart-bar.show{ display:flex; }
  .cart-bar .count{ font-size:12px; color:rgba(255,255,255,0.7); }
  .cart-bar .total{ font-family:'Fraunces',serif; font-size:17px; font-weight:600; }
  .cart-bar button{
    background:var(--gold);
    color:var(--white);
    border:none;
    border-radius:8px;
    padding:10px 16px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }

  /* DRAWER */
  .overlay{
    position:fixed; inset:0;
    background:rgba(13,34,38,0.45);
    display:none;
    z-index:30;
  }
  .overlay.show{ display:block; }
  .drawer{
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--white);
    border-radius:20px 20px 0 0;
    max-height:80vh;
    overflow-y:auto;
    padding:20px;
    z-index:31;
    transform:translateY(100%);
    transition:transform .25s ease;
  }
  .drawer.show{ transform:translateY(0); }
  .drawer h2{ margin:0 0 14px; font-size:20px; }
  .cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .cart-item-name{ font-size:13.5px; font-weight:600; }
  .cart-item-sub{ font-size:12px; color:#7a7368; margin-top:2px; }
  .qty-ctrl{ display:flex; align-items:center; gap:8px; }
  .qty-ctrl button{
    width:26px; height:26px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--white);
    font-size:14px;
    cursor:pointer;
  }
  .checkout-btn{
    width:100%;
    margin-top:16px;
    background:var(--gold);
    color:var(--white);
    border:none;
    border-radius:10px;
    padding:14px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .close-drawer{
    position:absolute;
    top:16px; right:16px;
    background:none;
    border:none;
    font-size:20px;
    cursor:pointer;
    color:var(--ink);
  }
  .demo-flag{
    text-align:center;
    font-size:11px;
    color:var(--white);
    background:var(--ink);
    padding:6px;
    letter-spacing:0.5px;
  }
</style>
</head>

  <p class="tagline" style="text-align:center;">Moda & Casa</p>
</header>

<div class="tabs" id="tabs"></div>
<div class="subtabs" id="subtabs" style="display:none;"></div>
<div class="grid" id="grid"></div>

<div class="cart-bar" id="cartBar">
  <div>
    <div class="count" id="cartCount">0 itens</div>
    <div class="total" id="cartTotal">R$ 0,00</div>
  </div>
  <button onclick="openDrawer()">Ver carrinho</button>
</div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <button class="close-drawer" onclick="closeDrawer()">✕</button>
  <h2>Seu carrinho</h2>
  <div id="drawerItems"></div>
  <button class="checkout-btn" onclick="checkout()">Finalizar pedido no WhatsApp</button>
</div>

<script>
const WHATSAPP_NUMBER = "5548998372933";
const SUPABASE_URL = "https://qrbszabxipsmmzjrpcrd.supabase.co";
const SUPABASE_KEY = "sb_publishable_gYkQcuXvc2VGsonYMz3HiQ_hMWvSICg";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let products = [];
const categories = ["Todos", "Moda feminina", "Moda infantil", "Casa, mesa e banho"];
const subcategories = ["Todos", "Roupas de cama", "Utensílios de banheiro", "Cozinha", "Decoração"];
let activeCategory = "Todos";
let activeSubcategory = "Todos";
let cart = {};
let selectedColors = {};

async function loadProducts(){
  document.getElementById('grid').innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#888;padding:30px 0;">Carregando produtos...</p>';
  const { data, error } = await sb
    .from('products')
    .select('*')
    .eq('active', true)
    .order('created_at', { ascending:false });

  if(error){
    document.getElementById('grid').innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#888;padding:30px 0;">Não foi possível carregar os produtos. Tente recarregar a página.</p>';
    console.error(error);
    return;
  }

  const { data: variantData } = await sb.from('product_variants').select('*');

  products = (data || []).map(p => {
    const variants = (variantData || []).filter(v => v.product_id === p.id);
    return {
      id: p.id,
      name: p.name,
      category: p.category,
      sub: p.subcategory || null,
      price: Number(p.price),
      stock: p.stock,
      img: p.image_url,
      variants: variants.length ? variants : null
    };
  });

  products.forEach(p => {
    if(p.variants && !selectedColors[p.id]){
      const firstAvailable = p.variants.find(v => v.stock > 0) || p.variants[0];
      selectedColors[p.id] = firstAvailable.color;
    }
  });

  renderGrid();
}

function selectColor(productId, color){
  selectedColors[productId] = color;
  renderGrid();
}

function currentVariant(p){
  if(!p.variants) return null;
  return p.variants.find(v => v.color === selectedColors[p.id]) || p.variants[0];
}

function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map(c =>
    `<div class="tab ${c===activeCategory?'active':''}" onclick="setCategory('${c}')">${c}</div>`
  ).join('');
}

function setCategory(c){
  activeCategory = c;
  activeSubcategory = "Todos";
  renderTabs();
  renderSubtabs();
  renderGrid();
}

function setSubcategory(s){
  activeSubcategory = s;
  renderSubtabs();
  renderGrid();
}

function renderSubtabs(){
  const el = document.getElementById('subtabs');
  if(activeCategory !== "Casa, mesa e banho"){
    el.style.display = 'none';
    return;
  }
  el.style.display = 'flex';
  el.innerHTML = subcategories.map(s =>
    `<div class="subtab ${s===activeSubcategory?'active':''}" onclick="setSubcategory('${s}')">${s}</div>`
  ).join('');
}

function stockLabel(stock){
  if(stock === 0) return {cls:'out', text:'Esgotado'};
  if(stock <= 2) return {cls:'low', text:`Restam ${stock}`};
  return {cls:'in', text:'Disponível'};
}

function renderGrid(){
  const el = document.getElementById('grid');
  const list = products.filter(p => {
    const matchCat = activeCategory==='Todos' || p.category===activeCategory;
    const matchSub = activeCategory!=='Casa, mesa e banho' || activeSubcategory==='Todos' || p.sub===activeSubcategory;
    return matchCat && matchSub;
  });
  el.innerHTML = list.map(p => {
    const variant = currentVariant(p);
    const effectiveStock = variant ? variant.stock : p.stock;
    const s = stockLabel(effectiveStock);
    const imgHtml = p.img
      ? `<img src="${p.img}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;">`
      : 'Sem foto';
    const colorChips = p.variants ? `
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin:2px 0;">
        ${p.variants.map(v => `
          <span onclick="${v.stock>0 ? `selectColor('${p.id}','${v.color}')` : ''}"
            style="font-size:10.5px;padding:3px 8px;border-radius:999px;cursor:${v.stock>0?'pointer':'not-allowed'};
              border:1px solid ${selectedColors[p.id]===v.color?'var(--ink)':'var(--line)'};
              background:${selectedColors[p.id]===v.color?'var(--ink)':'var(--white)'};
              color:${selectedColors[p.id]===v.color?'var(--white)':(v.stock>0?'#555':'#bbb')};
              ${v.stock===0?'text-decoration:line-through;':''}">
            ${v.color}
          </span>
        `).join('')}
      </div>
    ` : '';
    return `
      <div class="card">
        <div class="card-img">${imgHtml}</div>
        <div class="card-body">
          <div class="card-name">${p.name}</div>
          ${colorChips}
          <div class="stock ${s.cls}">${s.text}</div>
          <div class="card-price">R$ ${p.price.toFixed(2).replace('.',',')}</div>
          <button class="add-btn" ${effectiveStock===0?'disabled':''} onclick="addToCart('${p.id}')">
            ${effectiveStock===0?'Indisponível':'Adicionar'}
          </button>
        </div>
      </div>
    `;
  }).join('');
}

function addToCart(id){
  const p = products.find(x=>x.id===id);
  const variant = currentVariant(p);
  const color = variant ? variant.color : null;
  const stock = variant ? variant.stock : p.stock;
  const key = color ? `${id}::${color}` : id;
  const inCart = cart[key]?.qty || 0;
  if(inCart >= stock) return;
  cart[key] = { qty: inCart+1, product:p, color, stock };
  updateCartBar();
}

function changeQty(key, delta){
  const item = cart[key];
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0){ delete cart[key]; }
  else if(item.qty > item.stock){ item.qty = item.stock; }
  updateCartBar();
  renderDrawer();
}

function cartTotals(){
  let count=0, total=0;
  Object.values(cart).forEach(i=>{ count+=i.qty; total+=i.qty*i.product.price; });
  return {count, total};
}

function updateCartBar(){
  const {count, total} = cartTotals();
  document.getElementById('cartCount').textContent = `${count} ${count===1?'item':'itens'}`;
  document.getElementById('cartTotal').textContent = `R$ ${total.toFixed(2).replace('.',',')}`;
  document.getElementById('cartBar').classList.toggle('show', count>0);
  renderDrawer();
}

function renderDrawer(){
  const el = document.getElementById('drawerItems');
  const items = Object.entries(cart);
  if(items.length===0){
    el.innerHTML = '<p style="font-size:13px;color:#7a7368;">Seu carrinho está vazio.</p>';
    return;
  }
  el.innerHTML = items.map(([key,item])=>`
    <div class="cart-item">
      <div>
        <div class="cart-item-name">${item.product.name}${item.color ? ' — '+item.color : ''}</div>
        <div class="cart-item-sub">R$ ${item.product.price.toFixed(2).replace('.',',')} un.</div>
      </div>
      <div class="qty-ctrl">
        <button onclick="changeQty('${key}',-1)">–</button>
        <span>${item.qty}</span>
        <button onclick="changeQty('${key}',1)">+</button>
      </div>
    </div>
  `).join('');
}

function openDrawer(){
  document.getElementById('overlay').classList.add('show');
  document.getElementById('drawer').classList.add('show');
}
function closeDrawer(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
}

function checkout(){
  const items = Object.values(cart);
  if(items.length===0) return;
  let msg = "Olá! Gostaria de fazer o seguinte pedido na Aquarius Store:%0A%0A";
  let total = 0;
  items.forEach(i=>{
    const sub = i.qty * i.product.price;
    total += sub;
    const colorLabel = i.color ? ` - Cor: ${i.color}` : '';
    msg += `• ${i.product.name}${colorLabel} (x${i.qty}) - R$ ${sub.toFixed(2).replace('.',',')}%0A`;
  });
  msg += `%0ATotal: R$ ${total.toFixed(2).replace('.',',')}`;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`, '_blank');
}

renderTabs();
renderSubtabs();
loadProducts();
</script>
</body>
</html>
